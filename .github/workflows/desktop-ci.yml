name: Desktop CI

on:
  push:
  pull_request:

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-24.04]

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/form10-ui/package-lock.json

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm --prefix crates/form10-ui ci

      - name: Build frontend
        run: npm --prefix crates/form10-ui run build

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace
        run: cargo check --workspace --all-targets

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check frontend
        run: npm --prefix crates/form10-ui run check

      - name: Build release
        run: npm --prefix crates/form10-ui run tauri build

      - name: Report release artifact sizes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("target/release")
          artifacts = []
          for path in root.rglob("*"):
              if path.name in {"form10-converter", "form10-converter.exe"} or path.suffix.lower() in {
                  ".app", ".appimage", ".deb", ".dmg", ".exe", ".msi", ".rpm"
              }:
                  artifacts.append(path)

          for path in sorted(artifacts):
              size = path.stat().st_size if path.is_file() else sum(
                  child.stat().st_size for child in path.rglob("*") if child.is_file()
              )
              print(f"{path}: {size / 1024 / 1024:.2f} MiB")
          PY
