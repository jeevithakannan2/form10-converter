[package]
name = "form10-ui"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "form10-converter"
path = "src/main.rs"

[dependencies]
form10-core = { path = "../form10-core" }
iced = { version = "0.14", features = ["fira-sans", "svg"] }
iced_runtime = "0.14"
opener = { version = "0.8", features = ["reveal"] }
rfd = "0.17"
